name: Generate profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate-outputs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate CRT stats card
        uses: LuciNyan/pixel-profile/action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          crt_outputs: |
            dist/github-stats-crt.svg?username=YashPratap17&include_all_commits=true

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      - name: Push cards and snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
